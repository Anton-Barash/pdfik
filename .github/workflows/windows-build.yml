name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build pdfik for Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Compile Windows executable
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          dart compile exe bin/main.dart -o build/pdfik.exe

      - name: Smoke test
        run: build/pdfik.exe --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfik-windows-x64
          path: build/pdfik.exe
          if-no-files-found: error